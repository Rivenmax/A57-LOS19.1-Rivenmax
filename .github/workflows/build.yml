name: Build
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Get tools
        run: |
          sudo apt-get update && sudo apt-get install -y erofs-utils brotli
          wget -O sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
      - name: Download vendor 19.1
        run: |
          mkdir -p v19
          cd v19
          for i in 00 01 02 03 04 05 06; do
            wget -O vendor-part-$i.zip "https://github.com/Rivenmax/A57-LOS19.1-Rivenmax/releases/download/v19.1-working/vendor-part-$i.zip"
          done
          wget -O vendor19.transfer.list "https://github.com/Rivenmax/A57-LOS19.1-Rivenmax/releases/download/v19.1-working/vendor19.transfer.list"
          cat vendor-part-*.zip > vendor.new.dat.br
          brotli -d vendor.new.dat.br
          cp vendor19.transfer.list vendor.transfer.list
          python3 ../sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          mkdir -p ../vendor19
          sudo mkdir -p /mnt/v19
          sudo mount -o loop,ro vendor.img /mnt/v19
          sudo cp -a /mnt/v19/. ../vendor19/
          sudo chown -R $(whoami) ../vendor19
          sudo umount /mnt/v19
          ls ../vendor19/
      - name: Download vendor 22.1
        run: |
          mkdir -p v22
          cd v22
          for i in 00 01 02 03 04 05 06 07; do
            wget -O vendor22-part-$i.zip "https://github.com/Rivenmax/A57-LOS19.1-Rivenmax/releases/download/v22.1-working/vendor22-part-$i.zip"
          done
          wget -O vendor22.transfer.list "https://github.com/Rivenmax/A57-LOS19.1-Rivenmax/releases/download/v22.1-working/vendor22.transfer.list"
          cat vendor22-part-*.zip > vendor.new.dat.br
          brotli -d vendor.new.dat.br
          cp vendor22.transfer.list vendor.transfer.list
          python3 ../sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          mkdir -p ../vendor22
          sudo mkdir -p /mnt/v22
          sudo mount -o loop,ro vendor.img /mnt/v22
          sudo cp -a /mnt/v22/. ../vendor22/
          sudo chown -R $(whoami) ../vendor22
          sudo umount /mnt/v22
          ls ../vendor22/
      - name: Diff vendor 19.1 vs 22.1 FULL
        run: |
          echo "=== lib64 ===" > diff-full.txt
          diff -r vendor19/lib64 vendor22/lib64 >> diff-full.txt 2>&1 || true
          echo "=== lib ===" >> diff-full.txt
          diff -r vendor19/lib vendor22/lib >> diff-full.txt 2>&1 || true
          echo "=== bin ===" >> diff-full.txt
          diff -r vendor19/bin vendor22/bin >> diff-full.txt 2>&1 || true
          echo "=== etc ===" >> diff-full.txt
          diff -r vendor19/etc vendor22/etc >> diff-full.txt 2>&1 || true
          echo "=== SPECIFIC ===" >> diff-full.txt
          ls -l vendor19/lib64/libril* vendor22/lib64/libril* >> diff-full.txt 2>&1 || true
          ls -l vendor19/lib/hw/lights* vendor22/lib/hw/lights* >> diff-full.txt 2>&1 || true
          ls -l vendor19/lib/hw/camera* vendor22/lib/hw/camera* >> diff-full.txt 2>&1 || true
          ls -l vendor19/bin/rild vendor22/bin/rild >> diff-full.txt 2>&1 || true
          ls -l vendor19/bin/hw/* vendor22/bin/hw/* >> diff-full.txt 2>&1 || true
          cat diff-full.txt
      - name: Upload diff full
        uses: actions/upload-artifact@v4
        with:
          name: vendor-diff-full
          path: diff-full.txt
