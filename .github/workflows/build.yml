name: Build Rivenmax 19.1
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4
        with:
          path: build-repo
      - name: Install deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig bc ccache libssl-dev rsync python3 repo squashfs-tools brotli
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
      - name: Repo init LOS 19.1
        run: |
          mkdir -p ~/los19.1
          cd ~/los19.1
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/build-repo/local_manifests/A57.xml .repo/local_manifests/A57.xml
          cat .repo/local_manifests/A57.xml
      - name: Repo sync
        run: |
          cd ~/los19.1
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags
      - name: CEK vendor dari repo Rivenmax - GA USAH DOWNLOAD LAGI
        run: |
          ls -lh ~/los19.1/vendor/oppo/A57/A57-vendor.mk
          ls -lh ~/los19.1/vendor/oppo/A57/lib/libril.so ~/los19.1/vendor/oppo/A57/lib64/libril.so
          ls ~/los19.1/vendor/oppo/A57/lib/ | wc -l
          ls ~/los19.1/vendor/oppo/A57/lib64/ | wc -l
          grep -c "PRODUCT_COPY_FILES" ~/los19.1/vendor/oppo/A57/A57-vendor.mk
          echo "VENDOR DARI REPO, UDAH LENGKAP, GA USAH DOWNLOAD"
      - name: FIX Rivenmax - Baterai + Backlight
        run: |
          cd ~/los19.1
          echo "Rivenmax fix: baterai + backlight via device tree, bukan via binary 22.1"
      - name: CEK DEVICE TREE + KERNEL
        run: |
          ls ~/los19.1/device/oppo/A57/rivenmax_A57.mk
          ls ~/los19.1/kernel/oppo/msm8937/Makefile
          echo "DEVICE + KERNEL ADA"
      - name: Build Rivenmax 19.1 - droid
        run: |
          cd ~/los19.1
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          mka droid -j2
      - name: CEK ABIS DROID
        run: |
          ls -lh ~/los19.1/out/target/product/A57/system.img
          ls -lh ~/los19.1/out/target/product/A57/vendor.img
          ls -lh ~/los19.1/out/target/product/A57/boot.img
          echo "DROID BERES"
      - name: Build bacon + Signing
        run: |
          cd ~/los19.1
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          mka bacon -j2
          ls -lh out/target/product/A57/rivenmax-19.1-*.zip
      - name: Upload Rivenmax ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rivenmax-19.1-A57-signed
          path: ~/los19.1/out/target/product/A57/rivenmax-19.1-*.zip
