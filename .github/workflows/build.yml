name: Build Rivenmax 19.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repo init
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir -p ~/Rivenmax
          cd ~/Rivenmax
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs
          echo "=== CARI A57.xml ==="
          find $GITHUB_WORKSPACE -name "A57.xml" | head -20
          ls -R $GITHUB_WORKSPACE | head -100
          mkdir -p .repo/local_manifests
          cp $(find $GITHUB_WORKSPACE -name "A57.xml" | head -1) .repo/local_manifests/A57.xml
          cat .repo/local_manifests/A57.xml
          repo sync -c -j$(nproc) --force-sync --no-clone-bundle --no-tags

      - name: CEK vendor
        run: |
          cd ~/Rivenmax
          echo "=== CEK vendor ==="
          ls vendor/oppo/A57/
          ls vendor/oppo/A57/lib/ | wc -l
          ls vendor/oppo/A57/lib64/ | wc -l

      - name: FIX Rivenmax
        run: |
          cd ~/Rivenmax
          echo "=== FIX Rivenmax ==="
          ls device/oppo/A57/

      - name: CEK DEVICE
        run: |
          cd ~/Rivenmax
          echo "=== CEK DEVICE ==="
          ls device/oppo/A57/rivenmax_A57.mk
          ls device/oppo/A57/
          ls kernel/oppo/msm8937/ | head -20

      - name: Build droid
        run: |
          cd ~/Rivenmax
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          echo "=== FIX PATH_OVERRIDE ==="
          export PATH_OVERRIDE_SOONG=""
          sed -i 's/${PATH_OVERRIDE_SOONG}//g' vendor/lineage/build/soong/Android.bp
          grep -n "generated_kernel_includes" -A 3 vendor/lineage/build/soong/Android.bp
          echo "=== BUILD ==="
          mka bacon -j$(nproc)

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.1-RIVENMAX-A57-signed
          path: ~/Rivenmax/out/target/product/A57/*.zip
