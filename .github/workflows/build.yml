name: Build LOS 19.1 A57 Rivenmax from ZIP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Download working ZIPs
        run: |
          wget -O 19.1.zip "https://sourceforge.net/projects/a57-los/files/lineage-19.1-20250522-UNOFFICIAL-A57.zip/download"
          ls -lh 19.1.zip
      - name: Extract vendor from working ZIP in Linux
        run: |
          sudo apt-get update && sudo apt-get install -y erofs-utils brotli python3
          unzip -o 19.1.zip vendor.new.dat.br vendor.transfer.list -d raw/
          cd raw && brotli -d vendor.new.dat.br
          python3 $GITHUB_WORKSPACE/tools/sdat2img.py vendor.transfer.list vendor.new.dat vendor.img
          mkdir -p vendor-extracted
          dump.erofs --extract=vendor-extracted vendor.img
          ls vendor-extracted/
