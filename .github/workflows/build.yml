name: Build Rivenmax 19.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Tambah SWAP 8GB
        run: |
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          df -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build env
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip brotli simg2img p7zip-full e2fsprogs squashfs-tools
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH
          git config --global user.name "Rivenmax"
          git config --global user.email "rivenmax@build.local"

      - name: Repo init 19.1 + Manifest Rivenmax
        run: |
          mkdir -p ~/los19.1 && cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/*.xml .repo/local_manifests/
          cat .repo/local_manifests/*.xml
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          ls -lh device/oppo/A57/rivenmax_A57.mk
          ls -lh device/oppo/A57/BoardConfig.mk
          ls -lh kernel/oppo/msm8937/Makefile | head
          df -h
          rm -rf .repo
          df -h

      - name: Download vendor 19.1 + BIKIN A57-vendor.mk OTOMATIS - SKIP APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          mkdir -p vendor/oppo/A57
          mkdir -p /tmp/vendor_dl && cd /tmp/vendor_dl
          gh release download v19.1-working --repo Rivenmax/A57-LOS19.1-Rivenmax
          cat vendor-part-00.zip vendor-part-01.zip vendor-part-02.zip vendor-part-03.zip vendor-part-04.zip vendor-part-05.zip vendor-part-06.zip > vendor.new.dat.br
          brotli -d vendor.new.dat.br -o vendor.new.dat
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py vendor19.transfer.list vendor.new.dat vendor.img
          rm -rf /tmp/vendor_out
          sudo unsquashfs -no-xattrs -d /tmp/vendor_out vendor.img
          sudo chown -R $(whoami):$(whoami) /tmp/vendor_out
          cp -r /tmp/vendor_out/* ~/los19.1/vendor/oppo/A57/ || cp -r /tmp/vendor_out/. ~/los19.1/vendor/oppo/A57/
          ls -lh ~/los19.1/vendor/oppo/A57/bin/hw/android.hardware.light@2.0-service.A57
          cd ~/los19.1/vendor/oppo/A57
          echo "# Rivenmax - dari proprietary-files.txt, bukan find semua file" > A57-vendor.mk
          echo "PRODUCT_COPY_FILES += \\" >> A57-vendor.mk
          grep -v "^#" ~/los19.1/device/oppo/A57/proprietary-files.txt | grep -v "^$" | grep -v ".apk" | grep -v "vintf" | grep -v "compatibility_matrix" | grep -v "manifest.xml" | grep -v "light" | while read F; do
            REL=$(echo $F | cut -d: -f1 | cut -d";" -f1 | xargs)
            if [ -f "$REL" ]; then
              echo "    vendor/oppo/A57/$REL:vendor/$REL \\" >> A57-vendor.mk
            fi
          done
          sed -i '$ s/ \\$//' A57-vendor.mk
          echo "" > BoardConfigVendor.mk
          echo "# Rivenmax - vendor board config" >> BoardConfigVendor.mk
          echo "LOCAL_PATH := vendor/oppo/A57" > Android.mk
          grep -c "\.apk" A57-vendor.mk || echo "0 APK, aman"
          ls -lh A57-vendor.mk
          rm -rf /tmp/vendor_dl
          df -h

      - name: FIX Rivenmax - Baterai awet + Lockscreen mati total + Jaga libril biar IMEI ga 0
        run: |
          cd ~/los19.1/device/oppo/A57
          cat >> device.mk << 'EOF2'
          # RIVENMAX - BATERE AWET + LOCKSCREEN MATI TOTAL
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.vendor.power.boost=0 \
              persist.vendor.powerhal.enable=0 \
              ro.vendor.qti.sys.fw.bg_apps_limit=32 \
              persist.sys.doze.always_on=0 \
              ro.vendor.display.cabl=0
          EOF2
          sed -i 's/Ricky/Rivenmax/g' rivenmax_A57.mk || true
          sed -i 's/ryki/rivenmax/g' rivenmax_A57.mk || true
          cat rivenmax_A57.mk
          ls -lh ~/los19.1/vendor/oppo/A57/lib/libril.so || echo "libril 32 ga ada"
          ls -lh ~/los19.1/vendor/oppo/A57/lib64/libril.so || echo "libril 64 ga ada"
          ls -lh ~/los19.1/vendor/oppo/A57/bin/rild || echo "rild ga ada"

      - name: FIX Lights dari 22.1 - CUMA 2 FILE
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          mkdir -p /tmp/vendor22 && cd /tmp/vendor22
          gh release download v22.1-working --repo Rivenmax/A57-LOS19.1-Rivenmax
          cat vendor22-part-00.zip vendor22-part-01.zip vendor22-part-02.zip vendor22-part-03.zip vendor22-part-04.zip vendor22-part-05.zip vendor22-part-06.zip vendor22-part-07.zip > vendor22.new.dat.br || cat vendor22-part-*.zip > vendor22.new.dat.br
          brotli -d vendor22.new.dat.br -o vendor22.new.dat
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py vendor22.transfer.list vendor22.new.dat vendor22.img
          rm -rf /tmp/v22out
          sudo unsquashfs -no-xattrs -d /tmp/v22out vendor22.img
          sudo chown -R $(whoami):$(whoami) /tmp/v22out
          cp -v /tmp/v22out/bin/hw/android.hardware.light@2.0-service.A57 ~/los19.1/vendor/oppo/A57/bin/hw/android.hardware.light@2.0-service.A57 || echo "lights service 22.1 ga ketemu, pake 19.1 aja"
          cp -v /tmp/v22out/lib/hw/lights.msm8937.so ~/los19.1/vendor/oppo/A57/lib/hw/lights.msm8937.so || echo "lights lib 22.1 ga ketemu, pake 19.1 aja"
          cp -v /tmp/v22out/lib64/hw/lights.msm8937.so ~/los19.1/vendor/oppo/A57/lib64/hw/lights.msm8937.so || true
          rm -rf /tmp/vendor22 /tmp/v22out
          df -h

      - name: FIX Soong generated_kernel_includes JADI DUMMY
        run: |
          cd ~/los19.1
          python3 - << 'PYEOF'
          import pathlib, re
          p = pathlib.Path("vendor/lineage/build/soong/Android.bp")
          text = p.read_text()
          pattern = re.compile(r'genrule\s*\{\s*name:\s*"generated_kernel_includes".*?\n\}', re.DOTALL)
          dummy = '''genrule {
              name: "generated_kernel_includes",
              cmd: "mkdir -p $(genDir) && touch $(genDir)/dummy.h",
              out: ["dummy.h"],
          }'''
          if pattern.search(text):
              text = pattern.sub(dummy, text, count=1)
          else:
              text = dummy + "\n"
          p.write_text(text)
          PYEOF

      - name: Build Rivenmax - PAKE droid DULU BARU bacon
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          export SOONG_JOBS=2
          export NINJA_JOBS=2
          export MAKE_JOBS=2
          export _JAVA_OPTIONS="-Xmx4g -XX:+UseParallelGC"
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          mka droid -j2 || true
          ls -lh out/target/product/A57/*.img || echo "ABIS DROID MASIH GA ADA .img"
          du -sh out/ || true
          df -h
          mka bacon -j2 || true
          df -h
          ls -lh out/target/product/A57/ || echo "FOLDER A57 GA ADA"
          ls -lh out/target/product/A57/*.img || echo "GA ADA .img"
          ls -lh out/target/product/A57/*.zip || echo "GA ADA .zip"
          if [ ! -f out/target/product/A57/*.zip ]; then exit 1; fi

      - name: Sign pake key Rivenmax
        env:
          RELEASEKEY_PK8: ${{ secrets.RELEASEKEY_PK8 }}
          RELEASEKEY_X509: ${{ secrets.RELEASEKEY_X509 }}
          PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
          PLATFORM_X509: ${{ secrets.PLATFORM_X509 }}
          SHARED_PK8: ${{ secrets.SHARED_PK8 }}
          SHARED_X509: ${{ secrets.SHARED_X509 }}
          MEDIA_PK8: ${{ secrets.MEDIA_PK8 }}
          MEDIA_X509: ${{ secrets.MEDIA_X509 }}
        run: |
          cd ~/los19.1
          mkdir -p ~/.android-certs
          echo "$RELEASEKEY_PK8" | base64 -d > ~/.android-certs/releasekey.pk8
          echo "$RELEASEKEY_X509" | base64 -d > ~/.android-certs/releasekey.x509.pem
          echo "$PLATFORM_PK8" | base64 -d > ~/.android-certs/platform.pk8
          echo "$PLATFORM_X509" | base64 -d > ~/.android-certs/platform.x509.pem
          echo "$SHARED_PK8" | base64 -d > ~/.android-certs/shared.pk8
          echo "$SHARED_X509" | base64 -d > ~/.android-certs/shared.x509.pem
          echo "$MEDIA_PK8" | base64 -d > ~/.android-certs/media.pk8
          echo "$MEDIA_X509" | base64 -d > ~/.android-certs/media.x509.pem
          ./build/tools/releasetools/sign_target_files_apks.py -o -d ~/.android-certs $OUT/obj/PACKAGING/target_files_intermediates/*.zip signed-target.zip
          ./build/tools/releasetools/ota_from_target_files.py -k ~/.android-certs/releasekey --block signed-target.zip rivenmax-19.1-A57-signed.zip
          ls -lh rivenmax-19.1-A57-signed.zip

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: rivenmax-19.1-A57
          path: ~/los19.1/rivenmax-19.1-A57-signed.zip
