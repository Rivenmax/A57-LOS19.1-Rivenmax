name: Build Rivenmax 19.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space - PAKE ACTION RESMI
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cek disk abis dibersihin
        run: |
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build env
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip brotli simg2img p7zip-full e2fsprogs squashfs-tools
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
          fi
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          repo --version || ~/bin/repo --version
          git config --global user.name "Rivenmax"
          git config --global user.email "rivenmax@build.local"
          git config --global color.ui false

      - name: Repo init 19.1 murni - MANIFEST KOSONG
        run: |
          mkdir -p ~/los19.1 && cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/*.xml .repo/local_manifests/
          cat .repo/local_manifests/*.xml
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h

      - name: Clone device tree Rivenmax - UDAH ADA, GA NOT FOUND LAGI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          rm -rf device/oppo/A57
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Rivenmax/android_device_oppo_A57.git" -b main --depth 1 device/oppo/A57
          ls -lh device/oppo/A57/
          ls -lh device/oppo/A57/prebuilt/boot.img
          echo "=== KERNEL PAKE PREBUILT, GA PERLU CLONE KERNEL LAGI ==="
          echo "Sukisu095 aman, ga diusik"

      - name: Download vendor 19.1 - FIX UNSQUASHFS PAKE SUDO + NO-XATTRS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          mkdir -p vendor/oppo/A57
          mkdir -p /tmp/vendor_dl && cd /tmp/vendor_dl
          gh release download v19.1-working --repo Rivenmax/A57-LOS19.1-Rivenmax
          ls -lh
          echo "=== GABUNGIN PART JADI vendor.new.dat.br ==="
          cat vendor-part-00.zip vendor-part-01.zip vendor-part-02.zip vendor-part-03.zip vendor-part-04.zip vendor-part-05.zip vendor-part-06.zip > vendor.new.dat.br
          ls -lh vendor.new.dat.br
          echo "=== UNBROTLI ==="
          brotli -d vendor.new.dat.br -o vendor.new.dat
          ls -lh vendor.new.dat
          echo "=== SDAT2IMG ==="
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py vendor19.transfer.list vendor.new.dat vendor.img
          ls -lh vendor.img
          file vendor.img
          echo "=== EXTRACT PAKE SUDO UNSQUASHFS -NO-XATTRS ==="
          rm -rf /tmp/vendor_out
          sudo unsquashfs -no-xattrs -d /tmp/vendor_out vendor.img
          sudo chown -R $(whoami):$(whoami) /tmp/vendor_out
          ls -lh /tmp/vendor_out/
          echo "=== COPY ISI VENDOR KE vendor/oppo/A57 ==="
          cp -r /tmp/vendor_out/* ~/los19.1/vendor/oppo/A57/ || cp -r /tmp/vendor_out/. ~/los19.1/vendor/oppo/A57/
          ls -lh ~/los19.1/vendor/oppo/A57/bin/hw/android.hardware.light@2.0-service.A57
          ls ~/los19.1/vendor/oppo/A57/bin/hw/ | grep -i thortanium || echo "BERSIH, ga ada thortanium"

      - name: FIX Layar ga mau mati - Balikin Lights ke A57
        run: |
          cd ~/los19.1/device/oppo/A57
          grep -r "oppo_thortanium" . || echo "udah bersih, ga ada oppo_thortanium"
          grep -r "legacy_rild" . || echo "udah bersih, ga ada legacy_rild"
          if grep -rql "oppo_thortanium" .; then
            sed -i 's/oppo_thortanium/A57/g' $(grep -rl "oppo_thortanium" .)
            echo "FIXED: oppo_thortanium -> A57"
          fi
          if grep -rql "legacy_rild" .; then
            sed -i '/legacy_rild/d' $(grep -rl "legacy_rild" .)
            echo "FIXED: legacy_rild dihapus"
          fi
          grep -r "android.hardware.light" . || echo "cek light manual"

      - name: FIX Lunch - Hapus add_lunch_combo obsolete + Pake lunch langsung
        run: |
          cd ~/los19.1/device/oppo/A57
          echo "=== SEBELUM ==="
          cat vendorsetup.sh
          cat AndroidProducts.mk
          echo "=== HAPUS add_lunch_combo YANG OBSOLETE ==="
          sed -i '/add_lunch_combo/d' vendorsetup.sh
          echo "# Rivenmax - lunch dihandle AndroidProducts.mk" > vendorsetup.sh
          cat vendorsetup.sh
          echo "=== PASTIIN COMMON_LUNCH_CHOICES ADA ==="
          grep -q "COMMON_LUNCH_CHOICES" AndroidProducts.mk || echo "COMMON_LUNCH_CHOICES := rivenmax_A57-userdebug rivenmax_A57-user rivenmax_A57-eng" >> AndroidProducts.mk
          cat AndroidProducts.mk
          echo "=== CEK PRODUCT FILE ==="
          ls -lh *.mk
          grep -H "PRODUCT_NAME" rivenmax_A57.mk || grep -H "PRODUCT_NAME" *.mk

      - name: Build Rivenmax - PAKE LUNCH LANGSUNG, BUKAN BREAKFAST
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_KERNEL_CLANG_VERSION=11.0.1
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          mka bacon -j$(nproc --all)
          ls -lh $OUT/*.zip
          df -h

      - name: Sign pake key Rivenmax
        env:
          RELEASEKEY_PK8: ${{ secrets.RELEASEKEY_PK8 }}
          RELEASEKEY_X509: ${{ secrets.RELEASEKEY_X509 }}
          PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
          PLATFORM_X509: ${{ secrets.PLATFORM_X509 }}
          SHARED_PK8: ${{ secrets.SHARED_PK8 }}
          SHARED_X509: ${{ secrets.SHARED_X509 }}
          MEDIA_PK8: ${{ secrets.MEDIA_PK8 }}
          MEDIA_X509: ${{ secrets.MEDIA_X509 }}
        run: |
          cd ~/los19.1
          mkdir -p ~/.android-certs
          echo "$RELEASEKEY_PK8" | base64 -d > ~/.android-certs/releasekey.pk8
          echo "$RELEASEKEY_X509" | base64 -d > ~/.android-certs/releasekey.x509.pem
          echo "$PLATFORM_PK8" | base64 -d > ~/.android-certs/platform.pk8
          echo "$PLATFORM_X509" | base64 -d > ~/.android-certs/platform.x509.pem
          echo "$SHARED_PK8" | base64 -d > ~/.android-certs/shared.pk8
          echo "$SHARED_X509" | base64 -d > ~/.android-certs/shared.x509.pem
          echo "$MEDIA_PK8" | base64 -d > ~/.android-certs/media.pk8
          echo "$MEDIA_X509" | base64 -d > ~/.android-certs/media.x509.pem
          ls -lh ~/.android-certs/
          ./build/tools/releasetools/sign_target_files_apks.py -o -d ~/.android-certs $OUT/obj/PACKAGING/target_files_intermediates/*.zip signed-target.zip
          ./build/tools/releasetools/ota_from_target_files.py -k ~/.android-certs/releasekey --block signed-target.zip rivenmax-19.1-A57-signed.zip
          ls -lh rivenmax-19.1-A57-signed.zip

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: rivenmax-19.1-A57
          path: ~/los19.1/rivenmax-19.1-A57-signed.zip
