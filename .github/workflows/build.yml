name: Build Rivenmax 19.1

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free Disk Space - PAKE ACTION RESMI
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Tambah SWAP 8GB + Cek disk - BIAR GA OOM LAGI
        run: |
          free -h
          df -h
          sudo fallocate -l 8G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=8192
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          echo "vm.swappiness=60" | sudo tee -a /etc/sysctl.conf
          sudo sysctl -p || true
          free -h
          swapon --show

      - name: Cek disk abis dibersihin
        run: |
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build env
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip brotli simg2img p7zip-full e2fsprogs squashfs-tools
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
          fi
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          repo --version || ~/bin/repo --version
          git config --global user.name "Rivenmax"
          git config --global user.email "rivenmax@build.local"
          git config --global color.ui false

      - name: Repo init 19.1 murni - MANIFEST KOSONG
        run: |
          mkdir -p ~/los19.1 && cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/*.xml .repo/local_manifests/
          cat .repo/local_manifests/*.xml
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          df -h
          free -h

      - name: Clone device tree Rivenmax - UDAH ADA, GA NOT FOUND LAGI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          rm -rf device/oppo/A57
          git clone "https://x-access-token:${GH_TOKEN}@github.com/Rivenmax/android_device_oppo_A57.git" -b main --depth 1 device/oppo/A57
          ls -lh device/oppo/A57/
          ls -lh device/oppo/A57/prebuilt/boot.img
          echo "Sukisu095 aman, ga diusik"

      - name: Download vendor 19.1 - FIX UNSQUASHFS PAKE SUDO + NO-XATTRS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          mkdir -p vendor/oppo/A57
          mkdir -p /tmp/vendor_dl && cd /tmp/vendor_dl
          gh release download v19.1-working --repo Rivenmax/A57-LOS19.1-Rivenmax
          ls -lh
          cat vendor-part-00.zip vendor-part-01.zip vendor-part-02.zip vendor-part-03.zip vendor-part-04.zip vendor-part-05.zip vendor-part-06.zip > vendor.new.dat.br
          ls -lh vendor.new.dat.br
          brotli -d vendor.new.dat.br -o vendor.new.dat
          ls -lh vendor.new.dat
          curl -L -o sdat2img.py https://raw.githubusercontent.com/xpirt/sdat2img/master/sdat2img.py
          python3 sdat2img.py vendor19.transfer.list vendor.new.dat vendor.img
          ls -lh vendor.img
          file vendor.img
          rm -rf /tmp/vendor_out
          sudo unsquashfs -no-xattrs -d /tmp/vendor_out vendor.img
          sudo chown -R $(whoami):$(whoami) /tmp/vendor_out
          ls -lh /tmp/vendor_out/
          cp -r /tmp/vendor_out/* ~/los19.1/vendor/oppo/A57/ || cp -r /tmp/vendor_out/. ~/los19.1/vendor/oppo/A57/
          ls -lh ~/los19.1/vendor/oppo/A57/bin/hw/android.hardware.light@2.0-service.A57
          ls ~/los19.1/vendor/oppo/A57/bin/hw/ | grep -i thortanium || echo "BERSIH, ga ada thortanium"

      - name: FIX Device Tree Otomatis - LO GA PERLU EDIT DI HP LAGI
        run: |
          cd ~/los19.1/device/oppo/A57
          echo "=== TIMPA rivenmax_A57.mk YANG BENER ==="
          cat > rivenmax_A57.mk << 'EOF'
          $(call inherit-product, $(SRC_TARGET_DIR)/product/core_64_bit.mk)
          $(call inherit-product, $(SRC_TARGET_DIR)/product/full_base_telephony.mk)
          $(call inherit-product, vendor/lineage/config/common_full_phone.mk)
          $(call inherit-product, device/oppo/A57/device.mk)
          PRODUCT_NAME := rivenmax_A57
          PRODUCT_DEVICE := A57
          PRODUCT_MANUFACTURER := OPPO
          PRODUCT_BRAND := OPPO
          PRODUCT_MODEL := OPPO A57
          PRODUCT_GMS_CLIENTID_BASE := android-oppo
          TARGET_VENDOR := oppo
          TARGET_VENDOR_PRODUCT_NAME := A57
          PRODUCT_BUILD_PROP_OVERRIDES += \
              PRIVATE_BUILD_DESC="A57-user 7.1.1 N6F26Q eng.root.20250522.123456 release-keys" \
              PRODUCT_NAME="A57" \
              TARGET_DEVICE="A57"
          BUILD_FINGERPRINT := OPPO/A57/A57:7.1.1/N6F26Q/161111:user/release-keys
          EOF
          cat rivenmax_A57.mk
          echo "=== TIMPA device.mk - HAPUS PRODUCT_COPY_FILES boot.img BIAR GA TABRAKAN ==="
          cat > device.mk << 'EOF'
          LOCAL_PATH := device/oppo/A57
          TARGET_SPECIFIC_HEADER_PATH := $(LOCAL_PATH)/include
          PRODUCT_PACKAGES += \
              android.hardware.light@2.0-service.A57 \
              android.hardware.light@2.0-impl \
              liblights \
              android.hardware.health@2.1-service \
              android.hardware.health@2.1-impl
          PRODUCT_PROPERTY_OVERRIDES += \
              ro.vendor.build.security_patch=2025-05-22 \
              ro.build.fingerprint=OPPO/A57/A57:7.1.1/N6F26Q/161111:user/release-keys
          PRODUCT_AAPT_CONFIG := normal
          PRODUCT_AAPT_PREF_CONFIG := xxhdpi
          PRODUCT_AAPT_PREBUILT_DPI := xxhdpi xhdpi hdpi
          EOF
          cat device.mk
          echo "=== FIX vendorsetup.sh ==="
          echo "# Rivenmax - lunch dihandle AndroidProducts.mk" > vendorsetup.sh
          cat vendorsetup.sh
          echo "=== FIX AndroidProducts.mk ==="
          cat > AndroidProducts.mk << 'EOF'
          PRODUCT_MAKEFILES := \
              $(LOCAL_DIR)/rivenmax_A57.mk
          COMMON_LUNCH_CHOICES := \
              rivenmax_A57-userdebug \
              rivenmax_A57-user \
              rivenmax_A57-eng
          EOF
          cat AndroidProducts.mk
          echo "=== FIX BoardConfig.mk - BALIKIN BOARD_KERNEL_IMAGE_NAME ==="
          cat BoardConfig.mk
          sed -i '/TARGET_COPY_OUT_VENDOR/d' BoardConfig.mk
          sed -i '/TARGET_KERNEL_SOURCE/d' BoardConfig.mk
          sed -i '/TARGET_KERNEL_CONFIG/d' BoardConfig.mk
          sed -i '/BOARD_PREBUILT_BOOTIMAGE/d' BoardConfig.mk
          sed -i '/TARGET_PREBUILT_KERNEL/d' BoardConfig.mk
          sed -i '/TARGET_NO_KERNEL/d' BoardConfig.mk
          sed -i '/BOARD_KERNEL_IMAGE_NAME/d' BoardConfig.mk
          echo "TARGET_COPY_OUT_VENDOR := vendor" >> BoardConfig.mk
          echo "TARGET_KERNEL_SOURCE :=" >> BoardConfig.mk
          echo "TARGET_KERNEL_CONFIG :=" >> BoardConfig.mk
          echo "BOARD_PREBUILT_BOOTIMAGE := device/oppo/A57/prebuilt/boot.img" >> BoardConfig.mk
          echo "BOARD_KERNEL_IMAGE_NAME := Image.gz-dtb" >> BoardConfig.mk
          grep "TARGET_COPY_OUT_VENDOR" BoardConfig.mk
          grep "PREBUILT\|KERNEL_IMAGE" BoardConfig.mk

      - name: FIX Layar ga mau mati - Balikin Lights ke A57
        run: |
          cd ~/los19.1/device/oppo/A57
          grep -r "oppo_thortanium" . || echo "udah bersih, ga ada oppo_thortanium"
          grep -r "legacy_rild" . || echo "udah bersih, ga ada legacy_rild"
          if grep -rql "oppo_thortanium" .; then
            sed -i 's/oppo_thortanium/A57/g' $(grep -rl "oppo_thortanium" .)
            echo "FIXED: oppo_thortanium -> A57"
          fi
          if grep -rql "legacy_rild" .; then
            sed -i '/legacy_rild/d' $(grep -rl "legacy_rild" .)
            echo "FIXED: legacy_rild dihapus"
          fi
          grep -r "android.hardware.light" . || echo "cek light manual"

      - name: FIX Soong generated_kernel_includes JADI DUMMY
        run: |
          cd ~/los19.1
          python3 - << 'PYEOF'
          import pathlib, re
          p = pathlib.Path("vendor/lineage/build/soong/Android.bp")
          text = p.read_text()
          pattern = re.compile(r'genrule\s*\{\s*name:\s*"generated_kernel_includes".*?\n\}', re.DOTALL)
          dummy = '''genrule {
              name: "generated_kernel_includes",
              cmd: "mkdir -p $(genDir) && touch $(genDir)/dummy.h",
              out: ["dummy.h"],
          }'''
          if pattern.search(text):
              text = pattern.sub(dummy, text, count=1)
              print("PATCHED: generated_kernel_includes diganti dummy")
          else:
              text = dummy + "\n"
              print("PATCHED: file ditimpa dummy")
          p.write_text(text)
          print(p.read_text())
          PYEOF

      - name: Build Rivenmax - PAKE -j2 + DIAGNOSTIK KALO BACON FAIL
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_KERNEL_CLANG_VERSION=11.0.1
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          export SOONG_JOBS=2
          export NINJA_JOBS=2
          export MAKE_JOBS=2
          export _JAVA_OPTIONS="-Xmx4g -XX:+UseParallelGC"
          export ANDROID_JACK_VM_ARGS="-Dfile.encoding=UTF-8 -XX:+TieredCompilation -Xmx4g"
          free -h
          df -h
          source build/envsetup.sh
          lunch rivenmax_A57-userdebug
          mka bacon -j2 || true
          echo "=== DIAGNOSTIK ==="
          df -h
          ls -lh out/target/product/A57/ || echo "FOLDER A57 GA ADA"
          ls -lh out/target/product/A57/*.img || echo "GA ADA .img SAMA SEKALI - BERARTI GA NG-COMPILE"
          ls -lh out/target/product/A57/*.zip || echo "GA ADA .zip - MAKANYA ln GAGAL"
          du -sh out/ || true
          if [ ! -f out/target/product/A57/*.zip ]; then
            echo "BACON GAGAL BIKIN ZIP, LIAT DIAGNOSTIK DI ATAS"
            exit 1
          fi

      - name: Sign pake key Rivenmax
        env:
          RELEASEKEY_PK8: ${{ secrets.RELEASEKEY_PK8 }}
          RELEASEKEY_X509: ${{ secrets.RELEASEKEY_X509 }}
          PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
          PLATFORM_X509: ${{ secrets.PLATFORM_X509 }}
          SHARED_PK8: ${{ secrets.SHARED_PK8 }}
          SHARED_X509: ${{ secrets.SHARED_X509 }}
          MEDIA_PK8: ${{ secrets.MEDIA_PK8 }}
          MEDIA_X509: ${{ secrets.MEDIA_X509 }}
        run: |
          cd ~/los19.1
          mkdir -p ~/.android-certs
          echo "$RELEASEKEY_PK8" | base64 -d > ~/.android-certs/releasekey.pk8
          echo "$RELEASEKEY_X509" | base64 -d > ~/.android-certs/releasekey.x509.pem
          echo "$PLATFORM_PK8" | base64 -d > ~/.android-certs/platform.pk8
          echo "$PLATFORM_X509" | base64 -d > ~/.android-certs/platform.x509.pem
          echo "$SHARED_PK8" | base64 -d > ~/.android-certs/shared.pk8
          echo "$SHARED_X509" | base64 -d > ~/.android-certs/shared.x509.pem
          echo "$MEDIA_PK8" | base64 -d > ~/.android-certs/media.pk8
          echo "$MEDIA_X509" | base64 -d > ~/.android-certs/media.x509.pem
          ls -lh ~/.android-certs/
          ./build/tools/releasetools/sign_target_files_apks.py -o -d ~/.android-certs $OUT/obj/PACKAGING/target_files_intermediates/*.zip signed-target.zip
          ./build/tools/releasetools/ota_from_target_files.py -k ~/.android-certs/releasekey --block signed-target.zip rivenmax-19.1-A57-signed.zip
          ls -lh rivenmax-19.1-A57-signed.zip

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: rivenmax-19.1-A57
          path: ~/los19.1/rivenmax-19.1-A57-signed.zip
