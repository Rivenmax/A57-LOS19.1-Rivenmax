name: Build LOS 19.1 Rivenmax

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free Disk Space - PAKE ACTION RESMI
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Cek disk abis dibersihin
        run: |
          df -h
          free -h

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup build env
        run: |
          sudo apt update
          sudo apt install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python3-pip
          if ! command -v repo >/dev/null 2>&1; then
            mkdir -p ~/bin
            curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
            chmod a+x ~/bin/repo
          fi
          echo "$HOME/bin" >> $GITHUB_PATH
          export PATH="$HOME/bin:$PATH"
          repo --version || ~/bin/repo --version
          git config --global user.name "Rivenmax"
          git config --global user.email "rivenmax@build.local"
          git config --global color.ui false

      - name: Repo init 19.1 + PAKE MANIFEST BARU YANG UDAH BENER
        run: |
          mkdir -p ~/los19.1 && cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          repo init -u https://github.com/LineageOS/android.git -b lineage-19.1 --git-lfs --depth=1
          mkdir -p .repo/local_manifests
          cp $GITHUB_WORKSPACE/local_manifests/*.xml .repo/local_manifests/
          echo "=== ISI MANIFEST BARU YANG KEPAKE ==="
          cat .repo/local_manifests/*.xml
          repo sync -c -j$(nproc --all) --force-sync --no-clone-bundle --no-tags --optimized-fetch --prune
          echo "=== CEK DEVICE DARI MANIFEST ==="
          ls -lh device/oppo/A57/
          ls -lh kernel/oppo/msm8937/ | head -20
          echo "=== CEK DISK ABIS SYNC ==="
          df -h

      - name: Download vendor 19.1 murni dari Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd ~/los19.1
          mkdir -p vendor/oppo/A57
          mkdir -p /tmp/vendor_dl && cd /tmp/vendor_dl
          gh release download v19.1-working --repo Rivenmax/A57-LOS19.1-Rivenmax --pattern "vendor19*"
          ls -lh
          cat vendor19*.zip* > vendor19.zip
          unzip -o vendor19.zip -d ~/los19.1/vendor/oppo/A57
          ls -lh ~/los19.1/vendor/oppo/A57/bin/hw/android.hardware.light@2.0-service.A57
          echo "=== CEK JANGAN SAMPE ADA oppo_thortanium DI VENDOR 19.1 ==="
          ls ~/los19.1/vendor/oppo/A57/bin/hw/ | grep -i thortanium || echo "BERSIH, ga ada thortanium"

      - name: FIX Layar ga mau mati - Balikin Lights ke A57
        run: |
          cd ~/los19.1/device/oppo/A57
          echo "=== SEBELUM FIX ==="
          grep -r "oppo_thortanium" . || echo "udah bersih, ga ada oppo_thortanium"
          grep -r "legacy_rild" . || echo "udah bersih, ga ada legacy_rild"
          if grep -rql "oppo_thortanium" .; then
            sed -i 's/oppo_thortanium/A57/g' $(grep -rl "oppo_thortanium" .)
            echo "FIXED: oppo_thortanium -> A57"
          fi
          if grep -rql "legacy_rild" .; then
            sed -i '/legacy_rild/d' $(grep -rl "legacy_rild" .)
            echo "FIXED: legacy_rild dihapus"
          fi
          echo "=== SESUDAH FIX ==="
          grep -r "android.hardware.light" . || echo "cek light manual"

      - name: FIX Kernel 4.9 buat GCC baru
        run: |
          cd ~/los19.1/kernel/oppo/msm8937
          echo "=== PATCH kernel 4.9 biar bisa build di GCC baru ==="
          sed -i 's/-Werror=implicit-function-declaration//g' Makefile scripts/Makefile.build arch/arm64/Makefile 2>/dev/null || true
          sed -i 's/-Wimplicit-function-declaration//g' Makefile scripts/Makefile.build arch/arm64/Makefile 2>/dev/null || true
          find . -name "Makefile*" -type f -exec sed -i 's/-Werror=implicit-function-declaration//g; s/-Wimplicit-function-declaration//g' {} \; 2>/dev/null || true
          echo "KBUILD_CFLAGS += -Wno-error=implicit-function-declaration -Wno-error=implicit-int -Wno-error=return-mismatch -Wno-error=unused-function" >> Makefile
          grep -r "TARGET_KERNEL_CLANG_VERSION" ~/los19.1/device/oppo/A57/BoardConfig.mk || echo "TARGET_KERNEL_CLANG_VERSION := 11.0.1" >> ~/los19.1/device/oppo/A57/BoardConfig.mk
          echo "=== PATCH SELESAI ==="
          grep -n "Wno-error=implicit" Makefile | head -5

      - name: Build - MATIIN CCACHE BIAR HEMAT DISK
        run: |
          cd ~/los19.1
          export PATH="$HOME/bin:$PATH"
          export ALLOW_MISSING_DEPENDENCIES=true
          export TARGET_KERNEL_CLANG_VERSION=11.0.1
          export USE_CCACHE=0
          export CCACHE_DISABLE=1
          source build/envsetup.sh
          echo "=== CEK PRODUCT MK ==="
          ls device/oppo/A57/*.mk
          if [ -f device/oppo/A57/rivenmax_A57.mk ]; then PRODUCT_NAME="rivenmax_A57"; elif [ -f device/oppo/A57/lineage_A57.mk ]; then PRODUCT_NAME="lineage_A57"; else PRODUCT_NAME="rivenmax_A57"; fi
          echo "PRODUCT=$PRODUCT_NAME"
          breakfast $PRODUCT_NAME
          brunch $PRODUCT_NAME
          ls -lh $OUT/*.zip
          echo "=== CEK DISK ABIS BUILD ==="
          df -h

      - name: Sign pake key Rivenmax
        env:
          RELEASEKEY_PK8: ${{ secrets.RELEASEKEY_PK8 }}
          RELEASEKEY_X509: ${{ secrets.RELEASEKEY_X509 }}
          PLATFORM_PK8: ${{ secrets.PLATFORM_PK8 }}
          PLATFORM_X509: ${{ secrets.PLATFORM_X509 }}
          SHARED_PK8: ${{ secrets.SHARED_PK8 }}
          SHARED_X509: ${{ secrets.SHARED_X509 }}
          MEDIA_PK8: ${{ secrets.MEDIA_PK8 }}
          MEDIA_X509: ${{ secrets.MEDIA_X509 }}
        run: |
          cd ~/los19.1
          mkdir -p ~/.android-certs
          echo "$RELEASEKEY_PK8" | base64 -d > ~/.android-certs/releasekey.pk8
          echo "$RELEASEKEY_X509" | base64 -d > ~/.android-certs/releasekey.x509.pem
          echo "$PLATFORM_PK8" | base64 -d > ~/.android-certs/platform.pk8
          echo "$PLATFORM_X509" | base64 -d > ~/.android-certs/platform.x509.pem
          echo "$SHARED_PK8" | base64 -d > ~/.android-certs/shared.pk8
          echo "$SHARED_X509" | base64 -d > ~/.android-certs/shared.x509.pem
          echo "$MEDIA_PK8" | base64 -d > ~/.android-certs/media.pk8
          echo "$MEDIA_X509" | base64 -d > ~/.android-certs/media.x509.pem
          ls -lh ~/.android-certs/
          ./build/tools/releasetools/sign_target_files_apks.py -o -d ~/.android-certs $OUT/obj/PACKAGING/target_files_intermediates/*.zip signed-target.zip
          ./build/tools/releasetools/ota_from_target_files.py -k ~/.android-certs/releasekey --block signed-target.zip lineage-19.1-RIVENMAX-A57-signed.zip
          ls -lh lineage-19.1-RIVENMAX-A57-signed.zip

      - name: Upload hasil
        uses: actions/upload-artifact@v4
        with:
          name: lineage-19.1-RIVENMAX-A57
          path: ~/los19.1/lineage-19.1-RIVENMAX-A57-signed.zip
